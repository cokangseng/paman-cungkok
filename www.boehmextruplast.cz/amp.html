        .light-source {
            position: absolute;

            width: 200px;
            height: 150vh; /* Tinggi melebihi layar agar menembak ke atas */
            /* Membuat bentuk kerucut menggunakan clip-path */

        .beam-left {
            left: 0;

            animation: sweepLeft 6s infinite alternate ease-in-out;

            transform-origin: bottom center;
            animation: sweepRight 7s infinite alternate ease-in-out;
